# The only container with a host-facing network.
# 127.0.0.1:8000 -> app, 127.0.0.1:8025 -> Mailpit UI, 127.0.0.1:8050 -> dashboard.

# Docker's DNS. Upstreams are named through variables so nginx re-resolves
# them, and keeps working after a container is rebuilt with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000;
    set $app http://app:8000;

    # The admin API is for the dashboard inside the lab network only.
    location /admin {
        return 404;
    }

    location / {
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Synthetic-origin headers may only come from inside the lab network
        # (the scenario runner). Requests from the host get them removed.
        proxy_set_header X-Lab-Sim-IP "";
        proxy_set_header X-Lab-Sim-ASN "";
        proxy_set_header X-Lab-Sim-IP-Type "";
        proxy_set_header X-Lab-Sim-Geo "";
        proxy_set_header X-Lab-Sim-Device "";
    }
}

server {
    listen 8050;
    set $review http://review:8501;

    location / {
        proxy_pass $review;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}

server {
    listen 8025;
    set $mail http://mail:8025;

    location / {
        proxy_pass $mail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
