# The only container with a host-facing network.
# 127.0.0.1:8000 -> app, 127.0.0.1:8025 -> Mailpit UI.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Synthetic-origin headers may only come from inside the lab network
        # (the scenario runner). Requests from the host get them removed.
        proxy_set_header X-Lab-Sim-IP "";
        proxy_set_header X-Lab-Sim-ASN "";
        proxy_set_header X-Lab-Sim-IP-Type "";
        proxy_set_header X-Lab-Sim-Geo "";
        proxy_set_header X-Lab-Sim-Device "";
    }
}

server {
    listen 8025;

    location / {
        proxy_pass http://mail:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
