# Account Security Lab stack.
#
# Isolation:
#   lab  — internal-only network, no route out. db, app, mail, monitor, runner and
#          review live only here.
#   edge — host-facing network used only by the nginx gateway, which publishes
#          the app, mail UI and dashboard on 127.0.0.1. Nothing else can reach the internet.
# Check with: docker compose exec app python scripts/check_isolation.py
#
# Dev-only secrets below have defaults; override them in a .env file if you like.
name: account-lab

x-db-env: &db-env
  DATABASE_URL: postgresql://lab:${POSTGRES_PASSWORD:-lab-dev-only}@db:5432/lab
  LAB_REVIEW_DB_PASSWORD: ${LAB_REVIEW_DB_PASSWORD:-review-dev-only}

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  mail:
    # Catches every email the app sends. UI via the gateway: http://127.0.0.1:8025
    image: axllent/mailpit:v1.20.0
    networks: [lab]

  app:
    # Applies database migrations on startup.
    image: account-lab/app:local   # shared by app, monitor, runner and seed
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      <<: *db-env
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      APP_BASE_URL: http://127.0.0.1:8000
      LAB_TRUST_SIM_HEADERS: "true"
      LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:-lab-admin-dev-only}
      SECURITY_CONFIG: /srv/app/security/config.yaml
    volumes:
      # Read-write: the dashboard flips defences through the app's admin API.
      - ./app/security/config.yaml:/srv/app/security/config.yaml
      - ./data/out:/srv/data/out
    depends_on:
      db:
        condition: service_healthy
    networks: [lab]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  monitor:
    # Monitoring rules: reads telemetry every 2 s and raises alerts (when monitoring.enabled is on).
    image: account-lab/app:local   # shared by app, monitor, runner and seed
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["python", "-m", "telemetry.monitor"]
    environment:
      <<: *db-env
      SECURITY_CONFIG: /srv/app/security/config.yaml
    volumes:
      - ./app/security/config.yaml:/srv/app/security/config.yaml:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [lab]

  runner:
    # Scenario runner. Only talks to the app on the lab network.
    # CLI: docker compose exec runner python -m scenarios --help
    image: account-lab/app:local   # shared by app, monitor, runner and seed
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["uvicorn", "scenarios.server:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      <<: *db-env
      LAB_APP_URL: http://app:8000
      LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:-lab-admin-dev-only}
    depends_on:
      app:
        condition: service_healthy
    networks: [lab]

  review:
    # Dashboard. Reads with the read-only lab_review role; acts through /admin.
    build:
      context: .
      dockerfile: review/Dockerfile
    environment:
      REVIEW_DATABASE_URL: postgresql://lab_review:${LAB_REVIEW_DB_PASSWORD:-review-dev-only}@db:5432/lab
      LAB_APP_URL: http://app:8000
      LAB_RUNNER_URL: http://runner:8100
      LAB_ADMIN_TOKEN: ${LAB_ADMIN_TOKEN:-lab-admin-dev-only}
    depends_on:
      app:
        condition: service_healthy
    networks: [lab]

  gateway:
    # The only container with a route to the host. Blocks /admin and strips X-Lab-Sim-* headers.
    image: nginx:1.27.2-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app, mail, review]
    networks: [lab, edge]
    ports:
      - "127.0.0.1:8000:8000"   # account service
      - "127.0.0.1:8025:8025"   # Mailpit UI
      - "127.0.0.1:8050:8050"   # review dashboard

  seed:
    # One-off: docker compose run --rm seed
    image: account-lab/app:local   # shared by app, monitor, runner and seed
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["python", "-m", "data.seed", "--reset"]
    environment:
      <<: *db-env
    volumes:
      - ./data/out:/srv/data/out
    depends_on:
      db:
        condition: service_healthy
    networks: [lab]
    profiles: [tools]

networks:
  lab:
    internal: true
  edge:
    driver: bridge

volumes:
  pgdata:
